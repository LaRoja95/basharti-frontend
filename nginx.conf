server {
    listen 80;
    server_name bacharati.store www.bacharati.store _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Proxy API to backend — same-origin on custom domain (no CORS issues)
    location /api/ {
        proxy_pass https://basharti-basharti-backend.ezlcbl.easypanel.host/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host basharti-basharti-backend.ezlcbl.easypanel.host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CSS/JS change on every deploy and have no cache-busting filenames, so
    # they must always revalidate — otherwise returning visitors can be
    # stuck on a stale app.js for up to the old cache lifetime.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Images/icons are safe to cache aggressively since they rarely change.
    location ~* \.(?:svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
